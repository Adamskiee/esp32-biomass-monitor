name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'firmware/**'
      - 'mobileapp/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'firmware/**'
      - 'mobileapp/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Arduino data
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.core-simulator
          key: ${{ runner.os }}-arduino-${{ hashFiles('firmware/install_deps.sh') }}
          restore-keys: |
            ${{ runner.os }}-arduino-

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core and Dependencies
        run: ./firmware/install_deps.sh

      - name: Run Native Safety Tests
        run: ./firmware/tests/run_native_tests.sh

      - name: Compile Sketches
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all firmware/main/main.ino
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all firmware/tests/DHTTestCode/DHTTestCode.ino
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all firmware/tests/MQTestCode/MQTestCode.ino

  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install app dependencies
        working-directory: mobileapp
        run: flutter pub get

      - name: Analyze and test app
        working-directory: mobileapp
        run: |
          flutter analyze
          flutter test
