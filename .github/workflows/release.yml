name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Arduino data
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.core-simulator
          key: ${{ runner.os }}-arduino-${{ hashFiles('firmware/sketch.yaml') }}
          restore-keys: |
            ${{ runner.os }}-arduino-

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core and Dependencies
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.11 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli lib install "Adafruit PM25 AQI Sensor@2.0.0" "DHT sensor library@1.4.7"

      - name: Compile Sketches and Export
        run: arduino-cli compile --profile esp32 --warnings all --export-binaries firmware/

      - name: Package Hardware Assets
        run: |
          # Package specific release-ready files from the hardware directory
          # Note: Fails gracefully if no such files exist yet, ensuring pipeline doesn't break
          mkdir -p release-hardware
          find hardware/ -type f \( -name "*.pdf" -o -name "*.zip" -o -name "*.csv" \) -exec cp {} release-hardware/ \; || true
          cd release-hardware
          zip -r ../hardware-release.zip ./* || true
          cd ..

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/build/esp32.esp32.esp32/*.bin
            hardware-release*.zip
          generate_release_notes: true
