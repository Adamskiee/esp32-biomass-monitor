name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Arduino data
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.core-simulator
          key: ${{ runner.os }}-arduino-${{ hashFiles('firmware/sketch.yaml') }}
          restore-keys: |
            ${{ runner.os }}-arduino-

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Compile Sketches and Export
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          sketch-paths: |
            firmware
          cli-compile-flags: |
            - --profile
            - esp32
            - --warnings
            - all
            - --export-binaries

      - name: Package Hardware Assets
        run: |
          # Package specific release-ready files from the hardware directory
          # Note: Fails gracefully if no such files exist yet, ensuring pipeline doesn't break
          cd hardware
          zip -r ../hardware-release.zip . -i "*.pdf" "*.zip" "*.csv" || true
          cd ..

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/build/esp32.esp32.esp32/*.bin
            hardware-release*.zip
          generate_release_notes: true
