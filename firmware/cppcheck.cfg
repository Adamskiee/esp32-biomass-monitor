<?xml version="1.0"?>
<def format="2">
  <!-- FreeRTOS memory allocation -->
  <memory>
    <alloc>pvPortMalloc</alloc>
    <dealloc>vPortFree</dealloc>
  </memory>
  <!-- FreeRTOS Semaphore/Mutex definitions -->
  <resource>
    <alloc>xSemaphoreCreateMutex</alloc>
    <alloc>xSemaphoreCreateBinary</alloc>
    <alloc>xSemaphoreCreateCounting</alloc>
    <dealloc>vSemaphoreDelete</dealloc>
  </resource>
</def>
