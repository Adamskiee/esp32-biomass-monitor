openapi: 3.0.3
info:
  title: Biomass Monitor API
  description: >
    API for interacting with the ESP32 Biomass Monitor sensors and settings. 
    Note that as this is served from an ESP32, connections may be plaintext over HTTP.
    
    **CORS Warning:** The API echoes the Origin header, but the C++ backend currently does not explicitly set `Access-Control-Allow-Credentials: true`, which may cause browser preflight rejections when sending Basic Auth credentials.
  version: 1.0.0
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    SystemState:
      type: object
      properties:
        temperature_c:
          type: number
          format: float
          nullable: true
        chamber_temp_c:
          type: number
          format: float
          nullable: true
        mq2_v:
          type: number
          format: float
          nullable: true
    Settings:
      type: object
      properties:
        threshold_chamber_temp_c:
          type: number
          format: float
          minimum: 20.0
          maximum: 150.0
        threshold_mq2_v:
          type: number
          format: float
          minimum: 0.1
          maximum: 5.0
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
security:
  - basicAuth: []
paths: {}
