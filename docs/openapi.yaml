openapi: 3.0.3
info:
  title: Biomass Monitor API
  description: Authenticated local API for ESP32 telemetry and safety control.
  version: 3.0.0
servers:
  - url: /
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    SystemState:
      allOf:
        - $ref: '#/components/schemas/ThresholdSettings'
      type: object
      required:
        - pump_on
        - manual_sprinkler
        - temperature_c
        - chamber_temp_c
        - humidity_percent
        - mq135_v
        - mq2_v
        - mq_warming_up
        - mq_warmup_remaining_seconds
        - pm1_0_ug_m3
        - pm2_5_ug_m3
        - pm10_ug_m3
        - active_triggers
      properties:
        temperature_c:
          type: number
          format: float
          nullable: true
          minimum: -40
          maximum: 80
          description: DHT-22 ambient temperature in °C. Invalid or non-finite readings are null.
        humidity_percent:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 100
          description: DHT-22 relative humidity in percent. Invalid or non-finite readings are null.
        chamber_temp_c:
          type: number
          format: float
          nullable: true
        mq135_v:
          type: number
          format: float
          nullable: true
          description: MQ-135 voltage. Null when non-finite or during the five-minute MQ warm-up after device startup.
        mq2_v:
          type: number
          format: float
          nullable: true
          maximum: 4.8
          description: MQ-2 voltage. Null when non-finite, above the 4.8 V rail-short boundary, or during the five-minute MQ warm-up after device startup.
        mq_warming_up:
          type: boolean
          description: True while the MQ-135 and MQ-2 heaters complete their five-minute warm-up after device startup.
        mq_warmup_remaining_seconds:
          type: integer
          minimum: 0
          maximum: 300
          description: Seconds remaining before both MQ readings, gas alerts, and gas fault reporting become active.
        pm1_0_ug_m3:
          type: number
          format: float
          nullable: true
          description: Environmental PM1.0 mass concentration in µg/m³. Null before a valid reading or after ten seconds without one.
        pm2_5_ug_m3:
          type: number
          format: float
          nullable: true
          description: Environmental PM2.5 mass concentration in µg/m³. Null before a valid reading or after ten seconds without one.
        pm10_ug_m3:
          type: number
          format: float
          nullable: true
          description: Environmental PM10 mass concentration in µg/m³. Null before a valid reading or after ten seconds without one.
        pump_on:
          type: boolean
          description: Commanded pump relay output. This reports the relay command, not verified pump operation or water flow.
        manual_sprinkler:
          type: boolean
        active_triggers:
          type: array
          items:
            type: string
            enum:
              - high_chamber_temp
              - high_mq2_gas
              - high_mq135_gas
              - high_ambient_temp
              - high_pm1_0
              - high_pm2_5
              - high_pm10
              - low_humidity
              - high_humidity
              - temp_sensor_fault
              - mq2_sensor_fault
              - mq135_sensor_fault
              - ambient_temp_sensor_fault
              - humidity_sensor_fault
              - pms_sensor_fault
              - catastrophic_latch
          description: Only chamber danger and the catastrophic latch force the pump. Other conditions are alerts only. Faults do not require configured thresholds. Missing or stale PMS data produces one pms_sensor_fault.
    ThresholdPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      description: >-
        Nonempty partial update, maximum 1024 bytes. Only finite JSON numbers
        are accepted; booleans, strings, null, and unknown keys are rejected.
        Omitted fields retain their values. Humidity defaults to 30–60%; partial
        updates must keep minimum strictly below maximum after merging with
        saved values. An invalid field rejects the entire patch.
        Changes apply immediately and reevaluate valid cached readings. They
        cannot clear the catastrophic latch. Flash saves occur at most once per
        60 seconds, so power loss before persistence may lose accepted edits.
      properties:
        threshold_chamber_temp_c:
          type: number
          format: float
          minimum: 20.0
          maximum: 150.0
        threshold_mq2_v:
          type: number
          format: float
          minimum: 0.1
          maximum: 5.0
          description: Configured MQ-2 alert limit. Rail-short faults above 4.8 V take precedence, so limits above 4.8 V cannot produce a valid threshold crossing.
        threshold_mq135_v:
          type: number
          format: float
          minimum: 0.1
          maximum: 5.0
        threshold_temperature_c:
          type: number
          format: float
          minimum: -40
          maximum: 80
        threshold_pm1_0_ug_m3:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          maximum: 65535
        threshold_pm2_5_ug_m3:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          maximum: 65535
        threshold_pm10_ug_m3:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          maximum: 65535
        threshold_humidity_min_percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
        threshold_humidity_max_percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Must be strictly greater than the humidity minimum after merging the patch.
    ThresholdSettings:
      type: object
      required:
        - threshold_chamber_temp_c
        - threshold_mq2_v
        - threshold_mq135_v
        - threshold_temperature_c
        - threshold_pm1_0_ug_m3
        - threshold_pm2_5_ug_m3
        - threshold_pm10_ug_m3
        - threshold_humidity_min_percent
        - threshold_humidity_max_percent
      description: >-
        Complete saved configuration. Every field has a numeric default. Startup
        preserves configured values and fills previously unset fields from the
        defaults, queuing the migrated record for persistence. Humidity minimum
        is strictly below maximum. Configured limits cannot be cleared via the
        API. Earlier firmware can report null for supported but unset fields;
        missing fields mean unsupported. Ranges are configuration
        bounds, not health standards; MQ voltages are not calibrated gas levels.
        Upper alerts activate at or above the limit and clear at or below 95%.
        Ambient recovery instead subtracts the greater of 0.5 °C or 5% of the
        absolute limit. Humidity alerts activate strictly outside the range and
        recover inside it by the smaller of two percentage points or one quarter
        of the range width. Only chamber protection owns automatic pump control.
      properties:
        threshold_chamber_temp_c:
          type: number
          format: float
          default: 80
          minimum: 20
          maximum: 150
        threshold_mq2_v:
          type: number
          format: float
          default: 2.5
          minimum: 0.1
          maximum: 5
        threshold_mq135_v:
          type: number
          format: float
          default: 2
          minimum: 0.1
          maximum: 5
        threshold_temperature_c:
          type: number
          format: float
          default: 35
          minimum: -40
          maximum: 80
        threshold_pm1_0_ug_m3:
          type: number
          format: float
          default: 15
          minimum: 0
          exclusiveMinimum: true
          maximum: 65535
        threshold_pm2_5_ug_m3:
          type: number
          format: float
          default: 15
          minimum: 0
          exclusiveMinimum: true
          maximum: 65535
        threshold_pm10_ug_m3:
          type: number
          format: float
          default: 45
          minimum: 0
          exclusiveMinimum: true
          maximum: 65535
        threshold_humidity_min_percent:
          type: number
          format: float
          default: 30
          minimum: 0
          maximum: 100
        threshold_humidity_max_percent:
          type: number
          format: float
          default: 60
          minimum: 0
          maximum: 100
    ThresholdSuccessResponse:
      type: object
      required:
        - status
        - thresholds
      properties:
        status:
          type: string
          enum:
            - ok
        thresholds:
          $ref: '#/components/schemas/ThresholdSettings'
    SprinklerCommand:
      type: object
      required:
        - sprinkler
      properties:
        sprinkler:
          type: boolean
    SuccessResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
security:
  - basicAuth: []
paths:
  /api/state:
    get:
      summary: Retrieve sensor readings and current safety state
      responses:
        '200':
          description: Current cached readings and actuator state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemState'
        '401':
          description: Unauthorized
        '503':
          description: State mutex unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/control:
    post:
      summary: Request manual sprinkler state
      description: JSON body limit is 256 bytes. Automatic chamber safety and the catastrophic latch cannot be overridden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SprinklerCommand'
      responses:
        '200':
          description: Manual state accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '409':
          description: Automatic safety control is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Body exceeds 256 bytes
        '503':
          description: State mutex unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/thresholds:
    post:
      summary: Update any supported subset of safety thresholds transactionally
      description: Maximum JSON body size is 1024 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThresholdPatch'
      responses:
        '200':
          description: Complete configuration accepted by this request, independent of later updates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdSuccessResponse'
        '400':
          description: Empty, malformed, unknown, nonnumeric, null, out-of-range, or incorrectly ordered threshold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '413':
          description: Body exceeds 1024 bytes
        '503':
          description: State mutex unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/settings:
    get:
      summary: Retrieve current threshold settings
      responses:
        '200':
          description: Current threshold settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdSettings'
        '401':
          description: Unauthorized
        '503':
          description: State mutex unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Update thresholds through the compatibility route
      description: Same validation, 1024-byte body limit, and response as POST /api/thresholds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThresholdPatch'
      responses:
        '200':
          description: Complete configuration accepted by this request, independent of later updates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdSuccessResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '413':
          description: Body exceeds 1024 bytes
        '503':
          description: State mutex unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
