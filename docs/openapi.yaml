openapi: 3.0.3
info:
  title: Biomass Monitor API
  description: >
    API for interacting with the ESP32 Biomass Monitor sensors and settings. 
    Note that as this is served from an ESP32, connections may be plaintext over HTTP.
    
    **CORS Warning:** The API echoes the Origin header, but the C++ backend currently does not explicitly set `Access-Control-Allow-Credentials: true`, which may cause browser preflight rejections when sending Basic Auth credentials.
  version: 1.0.0
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    SystemState:
      type: object
      properties:
        temperature_c:
          type: number
          format: float
          nullable: true
        chamber_temp_c:
          type: number
          format: float
          nullable: true
        mq2_v:
          type: number
          format: float
          nullable: true
    Settings:
      type: object
      properties:
        threshold_chamber_temp_c:
          type: number
          format: float
          minimum: 20.0
          maximum: 150.0
        threshold_mq2_v:
          type: number
          format: float
          minimum: 0.1
          maximum: 5.0
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
security:
  - basicAuth: []
paths:
  /api/state:
    get:
      summary: Retrieves real-time sensor data
      responses:
        '200':
          description: A JSON object returning sensor readings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemState'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/settings:
    get:
      summary: Retrieves current configuration thresholds
      responses:
        '200':
          description: A JSON object containing current configuration limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Updates configuration thresholds
      description: >
        Accepts partial or full updates to thresholds.
        Warning: The ESP32 enforces a strict payload limit of 256 bytes and rejects fragmented packets to prevent DoS attacks.
        Warning: Settings are persisted to flash memory. Clients *must not* continuously poll or update settings, as rapid writes will permanently degrade the microcontroller's flash storage.
      requestBody:
        description: A JSON object accepting partial or full updates to the thresholds.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: Successful update
        '400':
          description: Empty payload, payload exceeds 256 bytes, or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
