openapi: 3.0.3
info:
  title: Biomass Monitor API
  description: Authenticated local API for ESP32 telemetry and safety control.
  version: 1.1.0
servers:
  - url: /
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    SystemState:
      type: object
      properties:
        temperature_c:
          type: number
          format: float
          nullable: true
        chamber_temp_c:
          type: number
          format: float
          nullable: true
        mq135_v:
          type: number
          format: float
          nullable: true
        mq2_v:
          type: number
          format: float
          nullable: true
        threshold_chamber_temp_c:
          type: number
          format: float
        threshold_mq2_v:
          type: number
          format: float
        fan_on:
          type: boolean
        sprinkler_on:
          type: boolean
        manual_sprinkler:
          type: boolean
        active_triggers:
          type: array
          items:
            type: string
            enum:
              - high_chamber_temp
              - high_mq2_gas
              - temp_sensor_fault
              - mq2_sensor_fault
              - catastrophic_latch
    Thresholds:
      type: object
      minProperties: 1
      properties:
        threshold_chamber_temp_c:
          type: number
          format: float
          minimum: 20.0
          maximum: 150.0
        threshold_mq2_v:
          type: number
          format: float
          minimum: 0.1
          maximum: 5.0
    SprinklerCommand:
      type: object
      required:
        - sprinkler
      properties:
        sprinkler:
          type: boolean
    SuccessResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
security:
  - basicAuth: []
paths:
  /api/state:
    get:
      summary: Retrieve sensor readings and current safety state
      responses:
        '200':
          description: Current cached readings and actuator state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemState'
        '401':
          description: Unauthorized
        '503':
          description: State mutex unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/control:
    post:
      summary: Request manual sprinkler state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SprinklerCommand'
      responses:
        '200':
          description: Manual state accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '409':
          description: Automatic safety control is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: State mutex unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/thresholds:
    post:
      summary: Update one or both safety thresholds transactionally
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Thresholds'
      responses:
        '200':
          description: Thresholds accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Missing, malformed, or out-of-range threshold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '503':
          description: State mutex unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/settings:
    get:
      summary: Retrieve current threshold settings
      responses:
        '200':
          description: Current threshold settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thresholds'
        '401':
          description: Unauthorized
        '503':
          description: State mutex unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Update thresholds through the compatibility route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Thresholds'
      responses:
        '200':
          description: Thresholds accepted
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '503':
          description: State mutex unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
